# Piper arm config (Windows side, reserved for future use)
arms:
  upper:
    can_port: "piper_upper"
    tool:                                  # 末端工具/标定板 在法兰盘坐标系中的位姿
      translation: [0.0, 0.0, 0.02]       # 米 (法兰盘坐标系)
      rotation_zxz: [0.0, 0.0, 0.0]      # 度, 内旋 Z-X-Z''
    arm_in_ccs:
      translation: [-0.0091, 0.0224, -0.1684]
      rotation_zxz: [0.0948, 89.4077, 86.6415]
    board_in_flange:
      translation: [-0.1671, 0.0017, 0.0566]
      rotation_zxz: [-70.2002, -2.3856, -20.0000]
    calib_arm_in_ccs:
      translation:
        init_value: [0.0000, 0.0000, -0.2000]
        bounds:
          - [-0.10, 0.10]
          - [-0.10, 0.10]
          - [-0.30, -0.10]
      rotation_zxz:
        init_value: [0.0000, 90.0000, 90.0000]
        bounds: 
          - [-20.0, 20.0]
          - [70.0, 110.0]
          - [70.0, 110.0]
    calib_board_in_flange: 
      translation:
        init_value: [-0.15, 0.0, 0.05]
        bounds:
          - [-0.20, -0.10]
          - [-0.05, 0.05]
          - [0.0, 0.10]
      rotation_zxz:
        init_value: [-90.0, 0.0, 0.0]
        bounds: 
          - [-110.0, -70.0]
          - [-20.0, 20.0]
          - [-20.0, 20.0]
  lower:
    can_port: "piper_lower"
    tool:
      translation: [0.0, 0.0, 0.02]
      rotation_zxz: [0.0, 0.0, 0.0]
    arm_in_ccs:
      translation: [-0.0106, 0.6283, -0.1682]
      rotation_zxz: [0.9223, 90.0716, 86.3688]
    board_in_flange:
      translation: [-0.1669, 0.0024, 0.0569]
      rotation_zxz: [-70.0000, -1.9208, -20.0000]
    calib_arm_in_ccs:
      translation:
        init_value: [0.0, 0.60, -0.20]
        bounds: 
          - [-0.10, 0.10]
          - [0.50, 0.70]
          - [-0.30, -0.10]
      rotation_zxz:
        init_value: [0.0000, 90.0000, 90.0000]
        bounds: 
          - [-20.0, 20.0]
          - [70.0, 110.0]
          - [70.0, 110.0]
    calib_board_in_flange: 
      translation:
        init_value: [-0.15, 0.0, 0.05]
        bounds:
          - [-0.20, -0.10]
          - [-0.05, 0.05]
          - [0.0, 0.10]
      rotation_zxz:
        init_value: [-90.0, 0.0, 0.0]
        bounds: 
          - [-110.0, -70.0]
          - [-20.0, 20.0]
          - [-20.0, 20.0]

# Network config (must match Ubuntu net.yaml)
network:
  ubuntu_ip: "192.168.10.4"
  port: 49300                # windows_end_monitor.py
  ctrl_port: 49301           # piper_windows_ctrl_server.py

test_record_arm_data:
  cam_indices:
    - 40772278
    - 40777498
    - 40772280
    - 40772279
    - 40777497
    - 40772277
    - 40772284
  ui_fps: 20.0
  calib_save_dir: "D:/calib_arm"  # 标定图片保存目录（本机所有相机共用）
  fps: 100
  gain: 0.0
  gamma: 1.0
  exposure_time: 8000.0
  window_width: 1600
  window_height: 800
  cam_width: 2448
  cam_height: 2048

hand_eye_calib:
  rotation_weight: 1.0            # 旋转残差权重 (<1 = 位置优先)
  upper:
    - 40772278
    - 40777498
    - 40772280
    - 40772279
  lower:
    - 40772280
    - 40777497
    - 40772277
    - 40772284

resolve_calib_board_pose:
  focus: 0.016                                    # 默认焦距 (m)
  pixel_size_x: 2.74e-6
  pixel_size_y: 2.74e-6
  center_cam: "40772280"
  only_use_center_cam: false                       # true = 只用中心相机, 用于对比多相机效果
  use_calibrated_arm_in_ccs: true                  # true = save_piper_chain 用标定后的 arm_in_ccs; false = 用 init_value

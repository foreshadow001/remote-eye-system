# Piper arm config (Windows side, reserved for future use)
arms:
  upper:
    can_port: "piper_upper"
    tool:                                  # 末端工具/标定板 在法兰盘坐标系中的位姿
      translation: [0.0, 0.0, 0.02]       # 米 (法兰盘坐标系)
      rotation_zxz: [0.0, 0.0, 45.0]      # 度, 内旋 Z-X-Z''
    arm_in_ccs:                            # 机械臂基座 在相机坐标系中的位姿
      translation: [0.0, 0.0, 0.0]        # 米
      rotation_zxz: [0.0, 90.0, 90.0]     # 度, 内旋 Z-X-Z''
    calib:
      translation:
        init_value: [0.0, 0.0, -0.2]
        bounds:
          - [-0.05, 0.05]
          - [-0.05, 0.05]
          - [-0.1, -0.3]
      rotation_zxz:
        init_value: 
        bounds: []
  lower:
    can_port: "piper_lower"
    tool:
      translation: [0.0, 0.0, 0.02]
      rotation_zxz: [0.0, 0.0, 0.0]
    arm_in_ccs:
      translation: [0.0, 0.6, 0.0]
      rotation_zxz: [0.0, 90.0, 90.0]
    calib:
      translation:
        init_value: 
        bounds: []
      rotation_zxz:
        init_value: 
        bounds: []

# Network config (must match Ubuntu net.yaml)
network:
  ubuntu_ip: "192.168.10.4"
  port: 49300

test_record_arm_data:
  cam_indices:
    - 40772278
    - 40777498
    - 40772280
    - 40772279
    - 40777497
    - 40772277
    - 40772284
  ui_fps: 20.0
  calib_save_dir: "D:/calib_arm"  # 标定图片保存目录（本机所有相机共用）
  fps: 100
  gain: 0.0
  gamma: 1.0
  exposure_time: 8000.0
  window_width: 1600
  window_height: 800
  cam_width: 2448
  cam_height: 2048

resolve_calib_board_pose:
  input_image_dir: "D:/calib_arm"                 # 标定图片目录 (upper/ lower/ 子目录)
  xml_dir: "D:/calib_output"                      # calib_cam_chain 输出的 *_Data.xml 所在目录
  output_dir: "D:/calib_board_pose"               # 输出 board_poses_upper.txt, board_poses_lower.txt
  calib_plane: "C:/hitsz/apps/MVTec/multiple_cameras/calib/HG-180.cpd"
  focus: 0.016                                    # 默认焦距 (m)
  pixel_size_x: 2.74e-6
  pixel_size_y: 2.74e-6
  center_cam: "40772280"
  only_use_center_cam: false                       # true = 只用中心相机, 用于对比多相机效果

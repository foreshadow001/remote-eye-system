# calib_arm.yaml — 机械臂标定数据采集 (test_record_arm_data.cpp)

network:                              # 从 piper.yaml network 节点迁移
  ubuntu_ip: "192.168.10.4"
  ctrl_port: 49301                    # piper_windows_ctrl_server.py (movement + pose query)

record:                               # 从 piper.yaml test_record_arm_data 节点迁移
  cam_indices:
    - 40772278
    - 40777498
    - 40772279
    - 40777497
    - 40772277
    - 40772284

  day_id: "D001"                      # 机械臂每天标定一次, 格式 D001
  calib_save_dir: "D:/calib_arm"      # 总目录, 完整路径 = calib_save_dir/{day_id}

  fps: 100
  gain: 0.0
  gamma: 1.0
  exposure_time: 8000.0
  window_width: 1600
  window_height: 800
  ui_fps: 20.0
  cam_width: 2448
  cam_height: 2048

# 手眼标定 (test_piper_hand_eye_calib.cpp, 从 piper.yaml 搬迁)
hand_eye_calib:
  rotation_weight: 1.0            # 旋转残差权重 (<1 = 位置优先)
  upper:
    - 40772278
    - 40777498
    - 40772279
  lower:
    - 40777497
    - 40772277
    - 40772284

# 标定板位姿解算 (resolve_calib_board_pose.cpp, 从 piper.yaml 搬迁)
resolve:
  focus: 0.016                                    # 默认焦距 (m)
  pixel_size_x: 2.74e-6
  pixel_size_y: 2.74e-6
  center_cam: "40772280"
  only_use_center_cam: false                       # true = 只用中心相机, 用于对比多相机效果
  use_calibrated_arm_in_ccs: true                  # true = save_piper_chain 用标定后的 arm_in_ccs; false = 用 init_value

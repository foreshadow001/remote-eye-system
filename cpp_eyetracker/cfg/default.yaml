empirical_hyperparameter:
  getSearchRegionSideAndMid:
    kOffsetX: 1
    kOffsetY: 1
    kMinRemainderArea: 5

  getSearchRegionSideAndSide:
    kOffsetY: 0
    kMinRemainderArea: 5

  searchPupilInROI:
    kMorphKernelSize: 5
    kMorphCloseIterations: 2
    kValidResidualRatio: 0.60
    kAxisRatioTolerance: 1.75
    kMaxAngleAbs: 35

  searchGlassReflections:
    kMinContourArea: 50.0
    kMaxContourArea: 500.0
    kRoiPadding: 10
    kHoughDp: 1.0
    kHoughMinDistDivisor: 3.0
    kHoughParam1: 100.0
    kHoughParam2: 5.0
    kHoughMinRadius: 3
    kHoughMaxRadius: 25
    kDistTransformMaskSize: 5
    kMinDtRadius: 1.0
    kDtRadiusCentroidThresh: 3.0
    kFrameReflectionRatioThresh: 3.0
    kMagEpsilon: 1e-3
  isInsideGlassExclusion:
    kExclusionRadiusRatio: 1.2

  findNeighborInDirection:
    kDefaultSearchScaleLenRatio: 3.0
    kDefaultSearchScaleWidRatio: 2.0
    kMinContourArea: 2.0
    kMinDistRatio: 0.5
    kMinReliableLenRatio: 0.6
    kAngleSwapMin: 45.0
    kAngleSwapMax: 135.0
  searchReflectionChains:
    kMinNormEpsilon: 0.1
    kMaxChainLength: 20
  searchFrameReflections:
    kMinArea: 10.0
    kMaxArea: 50.0
    kMinLengthWidthRatio: 2.0
    kSearchScaleLenRatio: 3.0
    kSearchScaleWidRatio: 2.0
    kAngleSwapMin: 45.0
    kAngleSwapMax: 135.0
    kMinChainSizeToDraw: 3

  buildExclusionMask:
    kGlassExclusionScale: 1.2
    kFrameExclusionScale: 1.5
    kChainExclusionScale: 1.5

  shrinkRoiToValidGlints:
    kMaxNoiseArea: 3.0
    kClusterDistThresh: 80.0
    kMinClusterSize: 2
    kPadding: 30
    kDefaultLowSensitivityThresh: 50.0

  excludeIrisReflectionsFromROIs:
    kIrisReflectionThreshold: 100
    kMinIrisReflectionArea: 10
    kPadding: 2

  determineCornealReflectionROI:
    kMinExpandedRoiArea: 50
    kShrinkRatio: 0.05
    kMinRemainderArea: 10

  splitGlintsGeometry:
    kDistanceThresholdX: 100.0

  findBestPupilForCluster:
    kDarknessTolerance: 5.0

  selectBestGlintsPerCluster:
    kDistTolerance: 5.0
    kBrightTolerance: 5.0

  detectCluster:
    kMaxClusterResults: 2

  findGeometry:
    kMaxMissingPointsToFind: 2

  isGlintRepeated:
    kMinGlintDist: 4.0

  isGlintGeometryRepeated:
    kPointMatchTolerance: 3.0

  checkGlintGeometry:
    kDangerMaskThresh: 50.0
    kMinPadding: 5
    kPaddingRatio: 0.20
    kDilateKernelSize: 3
    kDilateIterations: 1
    kMinValidPixels: 5
    kTrimRatio: 0.10

  samplePupilEdgesByRayCasting:
    kRayCount: 72
    kRayMaxRadiusRatio: 1.5
    kMaxGlintBrightness: 200
    kGradientGap: 3
    kMinGradient: 2

  refinePupil:
    kGlintExclusionRadius: 15.0
    kMaxDistanceDeviationRatio: 0.2
    kRansacIterations: 100
    kRansacTolerance: 2.0
    kMinInlierRatio: 0.4
    kMaxGlintBrightness: 50

  refineGlintPoint:
    viz_mult: 5
    # --- ROI 提取与超分设置 ---
    kWindowSize: 6            # ROI 基础窗口大小（原图像素）。Glint 通常在 3~8 个像素左右，16 足够包围它并提供背景上下文。
    kPaddingRatio: 0.0        # ROI 扩展比例（按你要求设置为 0.1）。
    sr_scale: 4               # 超分辨率放大倍数。推荐 4 倍（Lanczos4 在 4 倍放大时平滑度与计算耗时的平衡最佳）。
    
    # --- 边缘射线采样设置 ---
    kRayCount: 36             # 射线发射数量。36 意味着每 10 度采样一次，对于极小圆的拟合来说点数刚刚好，再多容易引入临近噪声。
    kGradientGap: 2           # 梯度计算步长（SR 图像像素跨度）。配合 Lanczos4 的平滑特性，跨度设为 2 能有效捕获由于衍射产生的平缓下降沿。
    kMinGradient: 10          # 判定为边缘的最小梯度阈值。Glint 相比背景亮度落差很大，5.0 能滤除底噪同时保留微弱的真实边缘。
    kMinBrightness: 30.0    # 边缘点靠光斑内侧的最低亮度限制
    kRadiusMargin: 2.0      # 距离中点的一半后，附加的微小安全冗余半径 (原图像素级)

    # --- RANSAC 拟合设置 ---
    kRansacIterations: 100    # RANSAC 迭代次数。候选点最多只有 36 个，100 次迭代足够覆盖绝大多数有效组合（置信度 > 99%）。
    kInlierTolerance: 2.0     # 内点容差（SR 图像像素）。在 sr_scale=4 的情况下，2.0 代表原图的 0.5 个像素，这是一个非常严格且准确的正圆约束条件。
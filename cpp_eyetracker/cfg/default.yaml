    kRatioV: 1
    kMinExpandedRoiArea: 50
    kShrinkRatio: 0.05
    kMinRemainderArea: 10

  splitGlintsGeometry:
    kDistanceThresholdX: 100.0

  selectBestGlintsPerCluster:
    kDistTolerance: 5.0
    kBrightTolerance: 5.0

  detectCluster:
    kMinUniqueGlintDist: 2.0
    kMaxClusterResults: 3

  findGeometry:
    kMaxMissingPointsToFind: 2

  isGlintRepeated:
    kMinGlintDist: 1.0

  isGlintGeometryRepeated:
    kPointMatchTolerance: 0.5

  checkAndPushGlintGeometry:
    kDangerMaskThresh: 50.0
    kMinPadding: 5
    kPaddingRatio: 0.20
    kDilateKernelSize: 3
    kDilateIterations: 1
    kMinValidPixels: 5
    kTrimRatio: 0.10

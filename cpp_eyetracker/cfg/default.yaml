# Camera calibration
cam_calib:
  input_folder: "D:/hitsz/projects/new_dataset/calib/calib_three_cam/"
  calib_plane: "D:/apps/MVTec/multiple_cameras/calib/HG-180.cpd"
  output_folder: "D:/hitsz/projects/new_dataset/calib/cams/"
  focus: 0.012 # m
  pixel_size_x: 3.45e-6 # m
  pixel_size_y: 3.45e-6 # m

# Calibration Offline Settings
input_dir: "D:/ylx/calib_records"
output_dir: "D:/ylx/calib_results"

# Gaze Tracker Settings
gaze_tracker:
  use_chen_noise_reduction: true   # 是否使用 Chen 降噪算法
  cc_filter:
    enable: false
    window_size: 5
  pc_filter:
    enable: false
    window_size: 5

# Camera Settings
cam_pos: [29.0, -31.0, 17.0]
cam_xml_path:
  - "D:/ylx/calib/cams/Camera_Data.xml"
#  - "D:/ylx/calib/cams/Camera1_Data.xml"
#  - "D:/ylx/calib/cams/Camera2_Data.xml"
cam_angles: [-31.5, 0.0, 0.0]

# Lights Settings
lights_pos:
 - [-21.0, 0.0, 0.0] # [21, 3, 0]
 - [25.0, 0.0, 0.0] # [-25, 3, 1]
 - [0.0, 8.0, 5.0] # [0, -8, 6]

# Calibration General Settings
calib_init_values:
  left:
    alpha: 5
    beta: 1.5
    R: 0.78
    K: 0.42
    n1: 1.3375
    n2: 1.0
    D: 0.53
  right:
    alpha: -5
    beta: 1.5
    R: 0.78
    K: 0.42
    n1: 1.3375
    n2: 1.0
    D: 0.53
  eye_cam_dist_init: 40.0

calib_values_bounds:
  alpha: [-5, 5]
  beta: [-5, 5]
  R: [0.4, 1.5]
  K: [0.1, 1.0]

# Screen Settings
screen_width_px: 2560
screen_height_px: 1440
screen_width_cm: 59.5
screen_height_cm: 33.6
screen_center: [-0.75, -20.99, -7.07]
screen_horizontal_direction: [-1.0, 0.0, 0.0]
screen_vertical_direction: [0.00, 0.85, -0.52]

# Visualization Settings
viz: true
viz_output_dir: "D:/ylx/calib_viz"

# Test Multi Cam
test_multi_cam:
  cam_indices:
    - 40061061
    - 40061280
    - 40109652
  hardware_trigger: false
  write_jpg: true
  debug_time: true
  save_dir: "D:/hitsz/projects/new_dataset/test_cam"
  fps: 200
  gain: 0.0
  gamma: 1.0
  exposure_time: 4000.0
  window_width: 1440
  window_height: 1080
  cam_width: 1440
  cam_height: 1080

# Calib Points Settings
calib_points:
  rows: 4
  cols: 5
  margin_x: 200
  margin_y: 300
  save_dir: "D:/hitsz/projects/new_dataset/calib_points"
  marker_scale: 3
  theme: "dark"

# Test Glint Detection
test_glint:
  local_debug: false
  debug_time: false
  debug_geometry: false
  mode: collecting
  viz: true
  num_images: 200
  input_folder: "D:/hitsz/projects/new_dataset/test_record/debug/glint"
  gaussian_kernel_size: 3
  laplacian_kernel_size: 1
  init_threshold_value: 125.0
  threshold_step: 12.5
  search_region_side_and_mid_offset_x: 1
  search_region_side_and_mid_offset_y: 1
  search_region_side_and_side_offset_y: 1

# Collect Potential Glint Triangles
collect_glint:
  use_record: true
  record_dir: "D:/hitsz/projects/new_dataset/test_record"
  num_images: 100
  input_folder: "D:/hitsz/projects/new_dataset/test_record/debug/collect_input"
  output_folder: "D:/hitsz/projects/new_dataset/test_record/collect_output"

original_specific_hyperparameter:
  pupil:
    searchPupilInROI:
      kAdaptiveThreshOffset: 10.0
      kAdaptiveThreshMax: 15.0
      kMinPupilArea: 50.0
      kMaxPupilArea: 800.0
      kMinPupilContourPoints: 5
      kMaxPupilAxis: 50.0
      kMaxAxisRatio: 2.0
      kMinSolidity: 0.60
      kMinFitRatio: 0.65
      kMaxAvgResidual: 0.40
      kMaxDarkness: 15.0
  
  glint:
    isPupilNearby:
      kExclusionRadiusRatio: 2.5
      
    checkAndPushGlintGeometry:
      kBrightnessThreshold: 25.0

    horizontal_pair:
      lr_y_min: 0
      lr_y_max: 7
      lr_x_min: 5
      lr_x_max: 20

    middle_point:
      conditions:
        - [0, 2, 0.2, 0.8, 0.05, 0.55, 0.2, 0.8, 0.05, 0.55]
        - [2, 3, 0.45, 0.7, 0.05, 0.25, 0.3, 0.55, 0.25, 0.5]
        - [3, 5, 0.45, 0.85, 0.04, 0.25, 0.15, 0.55, 0.3, 0.65]


  output_folder: "D:/calib_output"
  focus: 0.016 # m
  pixel_size_x: 2.74e-6 # m
  pixel_size_y: 2.74e-6 # m
  center_cam: ""         # 中心相机 SN，空则默认相机 0 为参考

# Calibration Offline Settings
test_calib:
  record_dir: "D:/hitsz/projects/new_dataset/eyetracker_test/ylx"
  num_images_per_folder: 20
  output_dir: "D:/hitsz/projects/new_dataset/eyetracker_test/ylx"

test_jitter:

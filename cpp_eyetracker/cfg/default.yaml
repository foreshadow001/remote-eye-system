  output_dir: "D:/hitsz/projects/new_dataset/eyetracker_test/ylx"
  num_images_per_folder: 20
  
  # 新增：对每个干净样本生成的噪声样本数量
  num_noise_samples: 10
  
  # Pupil Jitter 遍历配置 (单位: pixel std)
  pupil_jitter_start: 0.0
  pupil_jitter_step: 0.25
  pupil_jitter_end: 2.0
  
  # Glint Jitter 遍历配置 (单位: pixel std)
  glint_jitter_start: 0.0
  glint_jitter_step: 0.25
  glint_jitter_end: 2.0


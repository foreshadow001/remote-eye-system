# Camera calibration
cam_calib:
  input_folder: "D:/hitsz/projects/new_dataset/eyetracker_test/zyx/cam_calib/pictures/"
  calib_plane: "D:/apps/MVTec/multiple_cameras/calib/HG-180.cpd"
  output_folder: "D:/hitsz/projects/new_dataset/eyetracker_test/zyx/cam_calib/output/"
  focus: 0.0123
  pixel_size_x: 3.45e-6 # m
  pixel_size_y: 3.45e-6 # m

# Calibration Offline Settings
test_calib:
  record_dir: "D:/hitsz/projects/new_dataset/eyetracker_test/zyx"
  num_images_per_folder: 20
  output_dir: "D:/hitsz/projects/new_dataset/eyetracker_test/zyx"

# Gaze Tracker Settings
gaze_tracker:
  use_chen_noise_reduction: true   # 是否使用 Chen 降噪算法
  cc_filter:
    enable: false
    window_size: 5
  pc_filter:
    enable: false
    window_size: 5

# Camera Settings
cam_xml_path:
  - "D:/hitsz/projects/new_dataset/eyetracker_test/zyx/cam_calib/output/Camera0_Data.xml"
#  - "D:/ylx/calib/cams/Camera1_Data.xml"
#  - "D:/ylx/calib/cams/Camera2_Data.xml"

# Lights Settings
lights_pos:
 - [-21.7, 0.0, 0.0]
 - [18.5, 0.0, 0.0]
 - [0.0, 8.0, 5.0]

# Calibration General Settings
calib_init_values:
  left:
    alpha: 5
    beta: -1.5
    R: 0.78
    K: 0.42
    n1: 1.3375
    n2: 1.0
    D: 0.53
  right:
    alpha: -5
    beta: -1.5
    R: 0.78
    K: 0.42
    n1: 1.3375
    n2: 1.0
    D: 0.53
  eye_cam_dist_init: 70.0

calib_values_bounds:
  alpha: [-5, 5]
  beta: [-5, 5]
  R: [0.4, 1.5]
  K: [0.1, 1.0]

# Screen Settings
screen_width_px: 3840
screen_height_px: 2160
screen_width_cm: 59.6
screen_height_cm: 33.7
screen_center: [0.00, -18.14, -8.62]
screen_horizontal_direction: [-1.0, 0.0, 0.0]
screen_vertical_direction: [0.00, 0.91, -0.42]

# Visualization Settings
viz: true
viz_output_dir: "D:/ylx/calib_viz"

# Test Multi Cam
test_multi_cam:
  cam_indices:

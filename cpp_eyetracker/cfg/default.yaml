    kHoughMinRadius: 3
    kHoughMaxRadius: 25
    kDistTransformMaskSize: 5
    kMinDtRadius: 1.0
    kDtRadiusCentroidThresh: 3.0
    kFrameReflectionRatioThresh: 3.0
    kMagEpsilon: 1e-3
  isInsideGlassExclusion:

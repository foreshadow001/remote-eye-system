relaxed_specific_hyperparameter:
  pupil:
    searchPupilInROI:
      kAdaptiveThreshOffset: 10.0
      kAdaptiveThreshMax: 7.0
      kMinPupilArea: 50.0
      kMaxPupilArea: 1000.0
      kMinPupilContourPoints: 5
      kMaxPupilAxis: 50.0
      kMaxAxisRatio: 2.5
      kMinSolidity: 0.50
      kMinFitRatio: 0.55
      kMaxAvgResidual: 0.50
      kMaxDarkness: 15.0
  
  glint:
    isPupilNearby:
      kExclusionRadiusRatio: 2.5

    checkAndPushGlintGeometry:
      kBrightnessThreshold: 25.0

    horizontal_pair:
      lr_y_min: 0
      lr_y_max: 10
      lr_x_min: 3
      lr_x_max: 25

    middle_point:
      conditions:
        - [0, 2, 0.2, 0.8, 0.05, 0.55, 0.2, 0.8, 0.05, 0.55]
        - [2, 3, 0.45, 0.7, 0.05, 0.25, 0.3, 0.55, 0.25, 0.5]
        - [3, 5, 0.45, 0.85, 0.04, 0.25, 0.15, 0.55, 0.3, 0.65]

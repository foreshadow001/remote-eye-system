test_record:
  save_dir: "D:/hitsz/projects/new_dataset/eyetracker_test/zyx"
  write_jpg: true
  target_frames: 200
  remove_false: true

# Calib Points Settings
calib_points:
  rows: 4
  cols: 5
  margin_x: 200
  margin_y: 300
  save_dir: "D:/hitsz/projects/new_dataset/calib_points"
  marker_scale: 3
  theme: "dark"

# Test inference
test_two_eye:
  record_dir: "D:/hitsz/projects/new_dataset/debug_gaze"
  output_dir: "D:/hitsz/projects/new_dataset/debug_gaze"
  num_images_per_folder: 1

# Test Glint Detection
test_glint:
  local_debug: false
  debug_time: false
  debug_geometry: false
  param_type: "relaxed"
  is_collecting: false
  viz: true
  viz_threshold: true
  num_images: 200000
  input_folder: "D:/hitsz/projects/new_dataset/eyetracker_test/zyx/collect_input"
  use_record: false
  record_dir: "D:/hitsz/projects/new_dataset/eyetracker_test/zyx"
  gaussian_kernel_size: 3
  laplacian_kernel_size: 1
  init_threshold_value: 110
  threshold_step: 30
  mini_threshold: 20

# Collect Potential Glint Triangles
collect_glint:
  use_record: true
  record_dir: "D:/hitsz/projects/new_dataset/eyetracker_test/zyx"
  num_images: 100
  input_folder: "D:/hitsz/projects/new_dataset/test_record/debug/collect_input"
  output_folder: "D:/hitsz/projects/new_dataset/test_record/collect_output"


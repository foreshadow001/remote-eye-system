# transfer.yaml — 采集端发送器 (send_data / send_slave / send_ui) 配置
# 数据接收端: 处理主机 (Ubuntu, baseline_recv_data)

transfer:
  # 要传输的参与者 (send_ui 默认读取; send_slave 也可用 --participant 覆盖)
  participant_id: "P000"
  # 处理主机两个 100G 口 (两口合计 100G, 各接一台采集机)
  server_ip_master_link: "10.10.1.1"   # 口1 ← master 发往此处
  server_ip_slave_link: "10.10.2.1"    # 口2 ← slave 发往此处
  server_port: 5001                    # recv_data.py 监听端口

  # master↔slave 握手 (走现有 192.168.10.x 相机网络, master 监听)
  handshake_port: 50100

  # 数据通道并发流数 (每流一个 TCP 连接, 顺序取文件队列)
  # 单盘实测: 4 流最优 ~4.4GB/s (8 流交错惩罚, 单流 1.1GB/s→450MB/s)
  workers: 4

# capture.yaml — test_multi_cam_multi_host_hdf5.cpp 配置文件

capture:
  participant_id: "P001"          # 参与者编号，用于定位 gaze_target 目录
  participant_root:                # 仅存储盘符/根目录，participant_id 在代码中拼接
    - "D:/capture"
    - "D:/capture"
    - "D:/capture"
    - "D:/capture"
    - "D:/capture"
    - "E:/capture"
    - "E:/capture"
    - "E:/capture"
    - "E:/capture"
    - "E:/capture"

  cam_indices:
    - "40768742"
    - "40774056"
    - "40768741"
    - "40774063"
    - "40774057"
    - "40774064"
    - "40768744"
    - "40768743"
    - "40773101"
    - "40772283"

  hardware_trigger: true
  fps: 200
  gain: 0.0
  gamma: 1.0
  exposure_time: 4000.0
  cam_width: 2448
  cam_height: 2048
  record_time: 1.0
  capture_delay: 0.5                # CAPTURING 后延迟录制 (s), 让受试者聚焦十字中心
  margin_frames_ratio: 0.05
  max_num_buffer: 30
  ui_fps: 5.0
  window_width: 1600
  window_height: 800
  enable_offset: false
  enable_intersection: false

  # 网络同步
  enable_net_sync: true
  is_master: false
  master_ip: "192.168.10.1"
  slave_ip: "192.168.10.2"
  port: 49200

  # 自动流程 (capture_with_M5Stack.cpp)
  enable_auto_move: true          # true = READY 后最多等 click_window, 无 SPACE 则跳过本次录制直接移臂
  click_window: 0.5                # 秒, READY 状态等待 SPACE 的最大时长 (默认 0.5)
  num_targets_per_arm: 3           # 每臂成功录制达到该数量 → OVER 状态 (0 = 不限制)

  # HDF5
  hdf5_chunk_frame_capacity: 2000

# 加载/验证节点
loader:
  participant_root:                # 仅存储盘符/根目录，participant_id 在代码中拼接
    - "D:/capture"
    - "D:/capture"
    - "D:/capture"
    - "D:/capture"
    - "D:/capture"
    - "E:/capture"
    - "E:/capture"
    - "E:/capture"
    - "E:/capture"
    - "E:/capture"
  cam_indices:
    - "40768742"
    - "40774056"
    - "40768741"
    - "40774063"
    - "40774057"
    - "40774064"
    - "40768744"
    - "40768743"
    - "40773101"
    - "40772283"
  cam_width: 2448
  cam_height: 2048

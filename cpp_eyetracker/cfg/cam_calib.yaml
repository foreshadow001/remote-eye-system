# cam_calib.yaml — 标定图像采集 (test_calib_transfer.cpp)

calib:
  cam_indices:
    - 40768742
    - 40774056
    - 40768741
    - 40774063
    - 40774057
    - 40774064
    - 40768744
    - 40768743
    - 40773101
    - 40772283

  is_master: false
  master_ip: "192.168.10.1"
  slave_ip: "192.168.10.2"
  port: 49200                       # TCP 控制 + 文件传输端口
  enable_net_sync: true

  calib_save_dir: "D:/calib_images"    # 总目录, 完整路径 = calib_save_dir/{participant_id}
                                     # participant_id 从 capture.yaml 读取

  # 可视化 (viz_calib_chain.py)
  viz_participant_id: ""              # 留空 → 使用 capture.yaml 的 participant_id

  # --- 标定算法参数 (calib_cam_chain.cpp) ---
  # 输入/输出目录 (空字符串 = 自动根据 calib_save_dir/{input_participant_id} 计算)
  input_participant_id: ""            # 留空 → 使用 capture.yaml 的 participant_id
  input_dir: ""                       # 留空 → calib_save_dir/{input_participant_id}/pictures
  output_dir: ""                      # 留空 → calib_save_dir/{input_participant_id}/output
  calib_plane: "C:/hitsz/apps/MVTec/multiple_cameras/calib/HG-180.cpd"
  focus: 0.016                       # m
  pixel_size_x: 2.74e-6              # m
  pixel_size_y: 2.74e-6              # m
  center_cam: "40772283"             # 中心相机 SN（空则默认 cam 0 为参考）
  focus_overrides:                   # 特定相机焦距覆盖 (m), SN → focus
    40772283: 0.075
    40772276: 0.075

  fps: 100
  gain: 0.0
  gamma: 1.0
  exposure_time: 8000.0
  calib_mono_exp_ext: 1.0
  window_width: 1600
  window_height: 800
  ui_fps: 20.0

  # 传输测试 (跳过相机初始化)
  test_transfer: false              # true = 跳过主循环, 直接测试 TCP 传输速度
  test_transfer_recv_dir: "D:/calib_transfer_test"  # Master 测试接收目录
